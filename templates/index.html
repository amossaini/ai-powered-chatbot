<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="A simple AI-powered chatbot interface." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='10' fill='%23635bff'/%3E%3Cpath d='M9 16a7 7 0 0 1 12.5-4.3A7 7 0 0 1 16 23l-4 1 1-4A7 7 0 0 1 9 16Z' fill='none' stroke='white' stroke-width='2'/%3E%3C/svg%3E" />
    <title>Chatly · AI Chatbot</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #172033;
        --muted: #718096;
        --subtle: #9ba7ba;
        --line: #e8ecf3;
        --surface: #ffffff;
        --background: #f7f9fc;
        --primary: #635bff;
        --primary-dark: #5149e8;
        --soft-primary: #f0efff;
        --shadow: 0 24px 70px rgba(41, 52, 86, 0.1);
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        color: var(--ink);
        background:
          radial-gradient(circle at 15% 0%, rgba(99, 91, 255, 0.08), transparent 31rem),
          var(--background);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      button,
      textarea {
        font: inherit;
      }

      .app-shell {
        width: min(100% - 32px, 1120px);
        min-height: 100vh;
        margin: 0 auto;
        padding: 32px 0;
        display: flex;
        flex-direction: column;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 24px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        color: var(--ink);
        font-size: 1.1rem;
        font-weight: 750;
        letter-spacing: -0.02em;
      }

      .brand-mark {
        width: 36px;
        height: 36px;
        display: grid;
        place-items: center;
        border-radius: 12px;
        color: #fff;
        background: linear-gradient(145deg, #817aff, #5149e8);
        box-shadow: 0 8px 18px rgba(99, 91, 255, 0.26);
      }

      .brand-mark svg {
        width: 19px;
        height: 19px;
      }

      .status {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
        font-size: 0.82rem;
        font-weight: 600;
      }

      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #31c48d;
        box-shadow: 0 0 0 4px rgba(49, 196, 141, 0.12);
      }

      .chat-card {
        flex: 1;
        min-height: 680px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        border: 1px solid rgba(224, 229, 239, 0.9);
        border-radius: 24px;
        background: var(--surface);
        box-shadow: var(--shadow);
      }

      .chat-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 25px 30px;
        border-bottom: 1px solid var(--line);
      }

      .chat-heading {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .bot-avatar {
        width: 46px;
        height: 46px;
        display: grid;
        place-items: center;
        border-radius: 15px;
        color: var(--primary);
        background: var(--soft-primary);
      }

      .bot-avatar svg {
        width: 24px;
        height: 24px;
      }

      h1,
      p {
        margin: 0;
      }

      h1 {
        font-size: 1.05rem;
        letter-spacing: -0.02em;
      }

      .chat-subtitle {
        margin-top: 3px;
        color: var(--muted);
        font-size: 0.82rem;
      }

      .new-chat {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 9px 13px;
        border: 1px solid var(--line);
        border-radius: 10px;
        color: var(--muted);
        background: #fff;
        cursor: pointer;
        font-size: 0.82rem;
        font-weight: 650;
        transition: border-color 160ms ease, color 160ms ease, background 160ms ease;
      }

      .chat-actions {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .history-link {
        padding: 9px 4px;
        color: var(--muted);
        font-size: 0.82rem;
        font-weight: 650;
        text-decoration: none;
      }

      .history-link:hover {
        color: var(--ink);
      }

      .new-chat:hover {
        border-color: #cfd5e3;
        color: var(--ink);
        background: #fafbfe;
      }

      .new-chat svg {
        width: 15px;
        height: 15px;
      }

      .messages {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 22px;
        padding: 34px clamp(22px, 7vw, 94px);
        overflow-y: auto;
      }

      .message {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        max-width: 79%;
        animation: appear 220ms ease-out;
      }

      .message.user {
        align-self: flex-end;
        flex-direction: row-reverse;
      }

      .message-avatar {
        flex: 0 0 32px;
        width: 32px;
        height: 32px;
        display: grid;
        place-items: center;
        border-radius: 10px;
        color: var(--primary);
        background: var(--soft-primary);
        font-size: 0.7rem;
        font-weight: 800;
      }

      .user .message-avatar {
        color: #fff;
        background: #242c3d;
      }

      .message-content {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .user .message-content {
        align-items: flex-end;
      }

      .message-author {
        color: var(--subtle);
        font-size: 0.72rem;
        font-weight: 700;
      }

      .message-bubble {
        padding: 14px 17px;
        border: 1px solid var(--line);
        border-radius: 4px 16px 16px 16px;
        color: #3c4658;
        background: #fafbfe;
        font-size: 0.92rem;
        line-height: 1.55;
      }

      .user .message-bubble {
        border-color: transparent;
        border-radius: 16px 4px 16px 16px;
        color: #fff;
        background: var(--primary);
      }

      .composer-area {
        padding: 20px 30px 25px;
        border-top: 1px solid var(--line);
        background: #fff;
      }

      .composer {
        display: flex;
        align-items: flex-end;
        gap: 12px;
        padding: 8px 8px 8px 17px;
        border: 1px solid #dfe4ee;
        border-radius: 15px;
        background: #fff;
        transition: border-color 160ms ease, box-shadow 160ms ease;
      }

      .composer:focus-within {
        border-color: rgba(99, 91, 255, 0.55);
        box-shadow: 0 0 0 4px rgba(99, 91, 255, 0.1);
      }

      textarea {
        width: 100%;
        min-height: 42px;
        max-height: 130px;
        resize: none;
        padding: 11px 0 6px;
        border: 0;
        outline: 0;
        color: var(--ink);
        background: transparent;
        font-size: 0.92rem;
        line-height: 1.45;
      }

      textarea::placeholder {
        color: #a1abbb;
      }

      .send-button {
        flex: 0 0 auto;
        width: 42px;
        height: 42px;
        display: grid;
        place-items: center;
        border: 0;
        border-radius: 11px;
        color: #fff;
        background: var(--primary);
        cursor: pointer;
        transition: background 160ms ease, transform 160ms ease;
      }

      .send-button:hover {
        background: var(--primary-dark);
        transform: translateY(-1px);
      }

      .send-button:disabled {
        cursor: not-allowed;
        opacity: 0.55;
        transform: none;
      }

      .send-button svg {
        width: 18px;
        height: 18px;
      }

      .helper-text {
        margin: 10px 2px 0;
        color: var(--subtle);
        font-size: 0.72rem;
      }

      .typing {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
        font-size: 0.8rem;
        font-style: italic;
      }

      .typing::before {
        width: 7px;
        height: 7px;
        display: inline-block;
        border: 2px solid #d9ddec;
        border-top-color: var(--primary);
        border-radius: 50%;
        content: "";
        animation: spin 700ms linear infinite;
      }

      @keyframes appear {
        from {
          opacity: 0;
          transform: translateY(5px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (max-width: 640px) {
        .app-shell {
          width: min(100% - 20px, 1120px);
          padding: 18px 0;
        }

        .chat-card {
          min-height: calc(100vh - 104px);
          border-radius: 18px;
        }

        .chat-header {
          padding: 18px;
        }

        .messages {
          padding: 25px 16px;
        }

        .message {
          max-width: 92%;
        }

        .composer-area {
          padding: 14px 16px 18px;
        }

        .new-chat {
          padding: 8px;
        }

        .new-chat span {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-4.7A8.38 8.38 0 0 1 4 12.5 8.5 8.5 0 0 1 8.7 4.9a8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 7 7v.5Z"/>
              <path d="m8 12 2 2 5-5"/>
            </svg>
          </div>
          <span>Chatly</span>
        </div>
        <div class="status"><span class="status-dot"></span> Ready to chat</div>
      </header>

      <section class="chat-card" aria-label="Chat with the assistant">
        <div class="chat-header">
          <div class="chat-heading">
            <div class="bot-avatar" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect x="4" y="7" width="16" height="12" rx="3"/>
                <path d="M8 12h.01M16 12h.01M9 16h6M12 7V4m-2 0h4"/>
              </svg>
            </div>
            <div>
              <h1>AI Assistant</h1>
              <p class="chat-subtitle">Your helpful conversation partner</p>
            </div>
          </div>
          <div class="chat-actions">
            <a class="history-link" href="/history">History</a>
            <button class="new-chat" id="clear-chat" type="button" title="Clear this chat">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 12a9 9 0 1 0 3-6.7"/>
                <path d="M3 4v6h6"/>
              </svg>
              <span>Clear Chat</span>
            </button>
          </div>
        </div>

        <div class="messages" id="messages" aria-live="polite">
          <div class="message assistant">
            <div class="message-avatar" aria-hidden="true">AI</div>
            <div class="message-content">
              <span class="message-author">AI Assistant</span>
              <div class="message-bubble">
                Hello! I’m your AI assistant. How can I help you today?
              </div>
            </div>
          </div>
        </div>

        <div class="composer-area">
          <form class="composer" id="chat-form">
            <textarea
              id="message-input"
              rows="1"
              maxlength="2000"
              placeholder="Type your message..."
              aria-label="Type your message"
              required
            ></textarea>
            <button class="send-button" id="send-button" type="submit" aria-label="Send message">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="m22 2-7 20-4-9-9-4Z"/>
                <path d="M22 2 11 13"/>
              </svg>
            </button>
          </form>
          <p class="helper-text">Press Enter to send · Shift + Enter for a new line</p>
        </div>
      </section>
    </main>

    <script>
      const form = document.querySelector("#chat-form");
      const input = document.querySelector("#message-input");
      const messages = document.querySelector("#messages");
      const sendButton = document.querySelector("#send-button");
      const clearChatButton = document.querySelector("#clear-chat");
      const conversation = [];

      function addMessage(text, sender) {
        const message = document.createElement("div");
        message.className = `message ${sender}`;
        message.innerHTML = `
          <div class="message-avatar" aria-hidden="true">${sender === "user" ? "YOU" : "AI"}</div>
          <div class="message-content">
            <span class="message-author">${sender === "user" ? "You" : "AI Assistant"}</span>
            <div class="message-bubble"></div>
          </div>
        `;
        message.querySelector(".message-bubble").textContent = text;
        messages.appendChild(message);
        messages.scrollTop = messages.scrollHeight;
      }

      function setLoading(isLoading) {
        sendButton.disabled = isLoading;
        input.disabled = isLoading;
        if (isLoading) {
          const typing = document.createElement("div");
          typing.className = "typing";
          typing.id = "typing";
          typing.textContent = "Assistant is preparing a response...";
          messages.appendChild(typing);
          messages.scrollTop = messages.scrollHeight;
        } else {
          document.querySelector("#typing")?.remove();
        }
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const message = input.value.trim();
        if (!message || sendButton.disabled) return;

        addMessage(message, "user");
        const history = conversation.slice(-6);
        conversation.push({ role: "user", content: message });
        input.value = "";
        input.style.height = "auto";
        setLoading(true);

        try {
          const response = await fetch("/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message, history }),
          });
          const data = await response.json();
          if (!response.ok) throw new Error(data.error || "Unable to send message.");
          addMessage(data.response, "assistant");
          conversation.push({ role: "assistant", content: data.response });
        } catch (error) {
          addMessage(error.message, "assistant");
        } finally {
          setLoading(false);
          input.disabled = false;
          input.focus();
        }
      });

      input.addEventListener("input", () => {
        input.style.height = "auto";
        input.style.height = `${Math.min(input.scrollHeight, 130)}px`;
      });

      input.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();
          form.requestSubmit();
        }
      });

      clearChatButton.addEventListener("click", () => {
        conversation.length = 0;
        messages.innerHTML = `
          <div class="message assistant">
            <div class="message-avatar" aria-hidden="true">AI</div>
            <div class="message-content">
              <span class="message-author">AI Assistant</span>
              <div class="message-bubble">Hello! I’m your AI assistant. How can I help you today?</div>
            </div>
          </div>
        `;
        input.focus();
      });
    </script>
  </body>
</html>
